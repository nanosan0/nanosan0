# 生成「蛇吃贡献格子」动画，推到 output 分支，README 里用 raw 链接引用。
# 手动触发：仓库 Actions → generate-snake → Run workflow
name: generate-snake

on:
  schedule:
    - cron: "15 0 * * *"        # 每天 08:15（UTC+8）
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - "output/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake svg
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # 配色跟主页的墨绿主色 (#0d7d74) 对齐，避免默认紫色跟页面打架。
          # color_dots 依次是「最浅 -> 最深」五档。
          color_snake: "#0d7d74"
          color_dots: "#ebedf0,#c6e9e3,#8ed3c9,#4bbfae,#0d7d74"
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
