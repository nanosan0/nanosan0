# 生成「蛇吃贡献格子」动画，推到 output 分支，README 里用 raw 链接引用。
# 手动触发：仓库 Actions → generate-snake → Run workflow
name: generate-snake

on:
  schedule:
    - cron: "15 0 * * *"        # 每天 08:15（UTC+8）
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - "output/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake svg
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # 配色写在 outputs 的查询串里（不是 action 的顶层参数，写顶层会被静默忽略）。
          # color_snake / color_dots 对齐主页墨绿主色 #0d7d74，# 需编码成 %23。
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230d7d74&color_dots=%23ebedf0,%23c6e9e3,%238ed3c9,%234bbfae,%230d7d74
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%234bbfae

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
